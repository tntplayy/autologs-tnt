<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUTOLOG APPS - Gestão de Acessos</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Babel para interpretar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0B0F19',
              card: '#111827',
              border: '#1F2937'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0B0F19] text-slate-100 font-sans antialiased overflow-hidden">
  <div id="root">
    <div class="flex h-screen items-center justify-center text-slate-400">
      Carregando Painel AUTOLOG...
    </div>
  </div>

  <!-- Carrega a lógica da aplicação -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
